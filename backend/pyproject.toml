[project]
name = "agrosense"
version = "0.1.0"
description = "AgroSense AI v2 - plataforma de analisis de restauracion ecologica"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.2.2",
    "pydantic==2.9.2",
    "openpyxl==3.1.5",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.3",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
    "httpx==0.27.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# La corrida por defecto es local y offline: SQLite en memoria.
# El smoke contra Supabase se pide a proposito con `pytest -m supabase`.
addopts = ["-m", "not supabase", "--strict-markers"]
markers = [
    "supabase: toca la instancia real de Supabase (requiere DATABASE_URL y red). Excluido por defecto.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
