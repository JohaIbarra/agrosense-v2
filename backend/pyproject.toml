[project]
name = "agrosense"
version = "0.1.0"
description = "AgroSense AI v2 - plataforma de analisis de restauracion ecologica"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.2.2",
    "pydantic==2.9.2",
    "openpyxl==3.1.5",
    # E6: proyeccion EPSG:9377 -> WGS84 para el mapa. Trae PROJ, que es la
    # implementacion de referencia; escribir la inversa a mano se equivoca
    # en silencio (ver adapters/geo/projection.py).
    "pyproj==3.8.0",
    # Versiones fijadas tras el escaneo de pip-audit del gate de fase 7
    # (hallazgo R5). fastapi 0.115.0 topaba starlette<0.39.0, lo que dejaba
    # inalcanzable el arreglo del DoS por multipart sin acotar.
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.3",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
    # openpyxl elige su backend XML segun si puede importar lxml, asi que
    # declararlo es lo que hace que el parser probado sea el de produccion.
    "lxml==6.1.0",
    # Transitivas fijadas por seguridad: no son imports nuestros, pero el
    # escaneo del cierre (requirements.lock.txt) las encontro con avisos
    # abiertos. anyio ademas es el threadpool donde corre el upload.
    # E1 (ADR-006): verificacion de los tokens de Supabase Auth (ES256 via JWKS).
    # `crypto` trae cryptography, necesario para las firmas asimetricas.
    "PyJWT[crypto]==2.15.0",
    "cryptography==50.0.1",
    "anyio==4.15.1",
    "idna==3.20",
    "certifi==2026.7.22",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.6.9",
    "httpx==0.27.2",
    # Gate 5 de AGENTS.md ("dependencies checked for known vulnerabilities")
    # ejecutable: pip-audit -r requirements.lock.txt (el CIERRE, no las raices).
    "pip-audit==2.10.1",
]
# E7 (ADR-013): SOLO para entrenar y evaluar offline el modelo de
# estancamiento (`python scripts/train_stall_model.py`). La API sirve el
# artefacto JSON en Python puro y NO necesita ninguna de las dos.
# scikit-learn >= 1.5.0 corrige CVE-2024-5206.
ml = [
    "scikit-learn==1.5.2",
    "numpy==1.26.4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# El artefacto del modelo viaja con el paquete: la API lo lee de ahi.
agrosense = ["ml/artifacts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# La corrida por defecto es local y offline: SQLite en memoria.
# El smoke contra Supabase se pide a proposito con `pytest -m supabase`.
addopts = ["-m", "not supabase", "--strict-markers"]
markers = [
    "supabase: toca la instancia real de Supabase (requiere DATABASE_URL y red). Excluido por defecto.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
