# Gates de "Completion" de AGENTS.md, automatizados (fase 8).
#
# Seguridad (revisado con ci-cd-security): actions fijadas por SHA de commit,
# permisos minimos de solo lectura, sin pull_request_target, sin secretos y
# sin interpolar entradas no confiables en `run`. Las pruebas que tocan el
# Supabase real (`-m supabase`) NO corren aqui: exigen secretos.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Instalar (cierre fijado + extras dev/ml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e ".[dev,ml]"
      - name: Lint (gate 2)
        run: python -m ruff check src tests scripts
      - name: Tipos (gate 3)
        run: python -m mypy
      - name: Tests (gates 1 y 6; incluye tests/architecture)
        run: python -m pytest -q
      - name: Vulnerabilidades del cierre (gate 5)
        run: python -m pip_audit -r requirements.lock.txt
      - name: Build (gate 4)
        run: python -m pip wheel . --no-deps -w dist

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (gate 2)
        run: npm run -s lint
      - name: Tests (gate 1)
        run: npm run -s test
      - name: Tipos + build (gates 3 y 4)
        run: npm run -s build
      - name: Vulnerabilidades (gate 5)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Recorridos criticos (AGENTS.md §Testing): API real sobre SQLite nueva y
    # Supabase Auth falso local (frontend/e2e/fake-auth.mjs). Nada sale del runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install -e .
      - name: Frontend + navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend
        env:
          CI: "true"
        run: npm run -s e2e
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    # La imagen de despliegue (ADR-015) se construye en cada cambio: un
    # Dockerfile roto se ve aqui, no el dia del deploy. Sin push a registro.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build de la imagen
        run: >
          docker build
          --build-arg VITE_SUPABASE_URL=https://example.supabase.co
          --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
          -t agrosense:ci .
      - name: Arranca y sirve el SPA (sin base de datos)
        run: |
          # Config ficticia (sin secretos): SQLite temporal y un SUPABASE_URL que
          # nunca se consulta, porque la peticion de prueba no lleva token.
          docker run -d --name app -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/ci.db -e SUPABASE_URL=https://example.supabase.co \
            agrosense:ci \
            uvicorn agrosense.adapters.api.app:create_app --factory --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/docs >/dev/null && break; sleep 1; done
          curl -sf -H 'Accept: text/html' http://127.0.0.1:8000/proyectos | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/projects)" = "401"
      - name: Logs del contenedor
        if: always()
        run: docker logs app 2>&1 | tail -50 || true
